name: CI

on:
  push:
    branches: [ master ]


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        path: zero-flax

    - name: Checkout zero-jax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-jax
        path: zero-jax

    - name: Checkout zero-chex
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-chex
        path: zero-chex

    - name: Checkout zero-optax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-optax
        path: zero-optax

    - name: Checkout zero-orbax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-orbax
        path: zero-orbax

    - name: Checkout zero-grain
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-grain
        path: zero-grain

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      working-directory: zero-flax
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install --no-deps \
          "git+https://github.com/SamuelMarks/griffe.git@rest#subdirectory=packages/griffelib" \
          "git+https://github.com/SamuelMarks/griffe.git@rest#subdirectory=packages/griffecli" \
          "git+https://github.com/SamuelMarks/griffe.git@rest"
        pip install --no-deps "https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/ml_ecosystem_snapshots-0.0.5-py3-none-any.whl"
        pip install "https://github.com/SamuelMarks/ml-switcheroo-ir/releases/download/v0.0.4/ml_switcheroo_ir-0.0.4-py3-none-any.whl"
        pip install "https://github.com/SamuelMarks/ml-switcheroo-compiler/releases/download/v0.0.1/ml_switcheroo_compiler-0.0.1-py3-none-any.whl"
        python -c "import pathlib, ml_switcheroo_compiler; (pathlib.Path(ml_switcheroo_compiler.__file__).parent / 'py.typed').touch()"
        pip install --no-deps -e ../zero-jax
        pip install --no-deps -e ../zero-chex
        pip install --no-deps -e ../zero-optax
        pip install --no-deps -e ../zero-orbax
        pip install --no-deps -e ../zero-grain
        pip install --no-deps -e .

    - name: Run Ruff Format & Lint
      working-directory: zero-flax
      run: |
        ruff format --check .
        ruff check .

    - name: Run Mypy & Strict Typing Linter
      working-directory: zero-flax
      run: |
        python3 scripts/lint_typing.py
        mypy --strict src scripts tests

    - name: Check Docstring Coverage (100%)
      working-directory: zero-flax
      run: |
        python3 scripts/check_docs.py
        interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests

    - name: Check Dependency Isolation & API Compliance
      working-directory: zero-flax
      run: |
        python3 scripts/check_deps.py
        python3 scripts/check_compliance.py
        python3 scripts/check_compiler_tests.py
        python3 scripts/check_parity_tests.py

    - name: Run Pytest (100% Line & Branch Coverage)
      working-directory: zero-flax
      run: |
        pytest --cov=src/zero_flax --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100

    - name: Build Package
      working-directory: zero-flax
      run: python -m build
