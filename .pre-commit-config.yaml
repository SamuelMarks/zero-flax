repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format --check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check
        entry: ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Mypy Type Check
        entry: mypy --strict src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: lint-typing
        name: Strict Typing & Reflection Lint
        entry: python3 scripts/lint_typing.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-docs
        name: AST Docstring Coverage Check
        entry: python3 scripts/check_docs.py
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: Interrogate Docstring Check
        entry: interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: check-deps
        name: Check 3rd-Party Dependencies
        entry: python3 scripts/check_deps.py
        language: system
        files: ^src/.*\.py$
        pass_filenames: false

      - id: check-api-compliance
        name: Check API Compliance (ml-ecosystem-snapshots v0.0.5)
        entry: python3 scripts/check_compliance.py
        language: system
        files: ^(SEMANTIC_PLAN\.md|src/.*\.py|scripts/.*\.py)$
        pass_filenames: false

      - id: check-compiler-tests
        name: Check Compiler Parity Tests
        entry: python3 scripts/check_compiler_tests.py
        language: system
        pass_filenames: false

      - id: check-parity-tests
        name: Check Semantic Parity Tests
        entry: python3 scripts/check_parity_tests.py
        language: system
        pass_filenames: false

      - id: pytest-coverage
        name: Pytest 100% Branch Coverage
        entry: pytest --cov=src/zero_flax --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false

      - id: update-badges
        name: Update README Badges
        entry: python3 scripts/update_badges.py
        language: system
        pass_filenames: false

      - id: build
        name: Build Package
        entry: python3 -m build
        language: system
        pass_filenames: false
